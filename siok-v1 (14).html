/* ══ HELPERS ═════════════════════════════════════════ */
function fmt(ms){
  if(ms<=0)return"00:00";
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);
  return`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function fmtDate(d){
  if(!d)return"";
  return new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
function fmtDateLong(d){
  if(!d)return"";
  return new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
}
function isOffreActive(offre){
  if(!offre.active)return false;
  if(!offre.permanente){
    const now=new Date();
    if(offre.date_debut&&new Date(offre.date_debut)>now)return false;
    if(offre.date_fin&&new Date(offre.date_fin)<now)return false;
  }
  return true;
}
function bannerColorSiok(str){
  let h=0;for(let i=0;i<(str||"").length;i++)h=(h*31+str.charCodeAt(i))>>>0;
  const hues=[200,220,240,260,180,210,230,250];
  return`hsl(${hues[h%hues.length]},55%,88%)`;
}
function getTypeMetier(id){
  return TYPES_METIER.find(t=>t.id===id)||TYPES_METIER[3];
}
function distanceM(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ══ CARTE EXPLORATEUR — Non connecté, clustering ═══ */
function LeafletMapExplorer({offres,city,height,userLocation}){
  const mapRef=useRef(null);
  const mapObj=useRef(null);
  const clusterRef=useRef(null);
  const cityData=CITIES.find(c=>c.id===city)||CITIES[0];

  useEffect(()=>{
    if(mapObj.current)return;
    mapObj.current=L.map(mapRef.current,{zoomControl:false,attributionControl:false})
      .setView(userLocation?[userLocation.lat,userLocation.lng]:[cityData.lat,cityData.lng],15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:19}).addTo(mapObj.current);
    L.control.zoom({position:"bottomright"}).addTo(mapObj.current);
    setTimeout(()=>mapObj.current&&mapObj.current.invalidateSize(),200);
  },[]);

  useEffect(()=>{
    if(!mapObj.current)return;
    if(clusterRef.current)mapObj.current.removeLayer(clusterRef.current);
    const cluster=L.markerClusterGroup({
      maxClusterRadius:50,
      iconCreateFunction:function(c){
        return L.divIcon({
          className:"",
          html:`<div style="width:40px;height:40px;border-radius:50%;background:rgba(0,102,255,0.85);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:3px solid white;box-shadow:0 2px 10px rgba(0,102,255,0.4);">${c.getChildCount()}</div>`,
          iconSize:[40,40],iconAnchor:[20,20]
        });
      }
    });
    offres.forEach(o=>{
      if(!o.lat||!o.lng)return;
      const type=getTypeMetier(o.type_offre);
      const icon=L.divIcon({
        className:"",
        html:`<div style="width:32px;height:32px;border-radius:50%;background:rgba(${type.color==="#F97316"?"249,115,22":type.color==="#EC4899"?"236,72,153":type.color==="#8B5CF6"?"139,92,246":"0,102,255"},0.5);display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid white;box-shadow:0 1px 6px rgba(0,0,0,0.2);">${type.emoji}</div>`,
        iconSize:[32,32],iconAnchor:[16,16]
      });
      const m=L.marker([o.lat,o.lng],{icon});
      m.bindPopup(`<div style="text-align:center;padding:4px 0"><strong>${o.titre}</strong><br/><span style="color:#0066FF;font-weight:700;">-${o.promo_pct}%</span></div>`,{className:"siok-popup",closeButton:false});
      cluster.addLayer(m);
    });
    if(userLocation){
      L.circleMarker([userLocation.lat,userLocation.lng],{radius:8,fillColor:"#0066FF",color:"white",weight:3,fillOpacity:1}).addTo(mapObj.current);
    }
    mapObj.current.addLayer(cluster);
    clusterRef.current=cluster;
  },[offres,userLocation]);

  return <div ref={mapRef} style={{height:height||"100%",width:"100%"}}/>;
}

/* ══ CARTE CONNECTÉ — Pins cliquables ═══════════════ */
function LeafletMapConnecte({offres,selected,onSelect,city,height=300,userLocation,visible}){
  const mapRef=useRef(null);
  const mapObj=useRef(null);
  const markersRef=useRef({});
  const cityData=CITIES.find(c=>c.id===city)||CITIES[0];

  useEffect(()=>{
    if(!mapObj.current){
      mapObj.current=L.map(mapRef.current,{zoomControl:true,attributionControl:true})
        .setView(userLocation?[userLocation.lat,userLocation.lng]:[cityData.lat,cityData.lng],15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:19}).addTo(mapObj.current);
    }
    setTimeout(()=>mapObj.current&&mapObj.current.invalidateSize(),100);
  },[]);

  useEffect(()=>{
    if(!mapObj.current||!visible)return;
    setTimeout(()=>mapObj.current&&mapObj.current.invalidateSize(),150);
  },[visible]);

  useEffect(()=>{
    if(!mapObj.current)return;
    Object.values(markersRef.current).forEach(m=>m.remove());
    markersRef.current={};
    offres.forEach(o=>{
      if(!o.lat||!o.lng)return;
      const type=getTypeMetier(o.type_offre);
      const isSel=selected?.id===o.id;
      const icon=L.divIcon({
        className:"",
        html:`<div style="width:${isSel?44:36}px;height:${isSel?44:36}px;border-radius:50%;background:${isSel?"#0066FF":type.color};display:flex;align-items:center;justify-content:center;font-size:${isSel?20:15}px;border:${isSel?"3px":"2px"} solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:all 0.2s;">${type.emoji}</div>`,
        iconSize:[isSel?44:36,isSel?44:36],iconAnchor:[isSel?22:18,isSel?22:18],
      });
      const marker=L.marker([o.lat,o.lng],{icon}).addTo(mapObj.current);
      marker.on("click",()=>onSelect(o));
      marker.bindPopup(`<div><strong>${o.titre}</strong><br/>${o.prestataire_nom||""}<br/><span style="color:#22c55e;font-weight:700;">-${o.promo_pct}% · ${o.prix?o.prix+"€":"?"}</span></div>`,{className:"siok-popup",closeButton:false,offset:[0,-20]});
      markersRef.current[o.id]=marker;
    });
    if(userLocation){
      L.circleMarker([userLocation.lat,userLocation.lng],{radius:8,fillColor:"#0066FF",color:"white",weight:2,fillOpacity:1}).addTo(mapObj.current);
    }
  },[offres,selected]);

  return <div ref={mapRef} style={{height,width:"100%",borderRadius:16,overflow:"hidden"}}/>;
}

/* ══ HOOK CHARGEMENT OFFRES (partagé) ════════════════ */
function useOffres(city, userLocation){
  const [offres,setOffres]=useState([]);
  const [loading,setLoading]=useState(true);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const cityData=CITIES.find(c=>c.id===city)||CITIES[0];
      const [{data:offresData},{data:prestData}]=await Promise.all([
        db().from("offres").select("*").eq("active",true).gt("promo_pct",0).order("created_at",{ascending:false}),
        db().from("prestataires").select("id,nom,adresse,ville,telephone,lat,lng,type_metier,photos"),
      ]);
      const prestMap={};
      (prestData||[]).forEach(p=>{prestMap[p.id]=p;});
      if(offresData){
        const enriched=offresData
          .filter(o=>isOffreActive(o))
          .map(o=>{
            const p=prestMap[o.prestataire_id]||{};
            return{...o,lat:p.lat||null,lng:p.lng||null,prestataire_nom:p.nom||"",adresse:p.adresse||"",ville:p.ville||"",telephone:p.telephone||"",type_offre:o.type_offre||p.type_metier||"autre"};
          })
          .filter(o=>o.lat&&o.lng&&distanceM(cityData.lat,cityData.lng,o.lat,o.lng)<15000)
          .sort((a,b)=>{
            if(!userLocation)return 0;
            return distanceM(userLocation.lat,userLocation.lng,a.lat,a.lng)-distanceM(userLocation.lat,userLocation.lng,b.lat,b.lng);
          });
        setOffres(enriched);
      }
    }catch(e){console.error("useOffres:",e);}
    setLoading(false);
  },[city]);

  useEffect(()=>{load();},[load]);
  return {offres,loading,reload:load};
}

        {/* Points + onglets */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{display:"flex",gap:6,flex:1}}>
            {[{v:"offres",l:"🎯 Offres"},{v:"favoris",l:"❤️ Favoris"},{v:"visites",l:"🏆 Historique"}].map(t=>(
              <button key={t.v} onClick={()=>{setTab(t.v);setSelected(null);}}
                style={{flex:1,padding:"7px 0",borderRadius:10,border:`1.5px solid ${tab===t.v?CS.accent:"#E8E8E8"}`,background:tab===t.v?CS.accentSoft:"transparent",color:tab===t.v?CS.accent:CS.muted,fontSize:11,fontWeight:tab===t.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                {t.l}
              </button>
            ))}
          </div>
          <div style={{background:"rgba(0,102,255,0.1)",borderRadius:10,padding:"4px 10px",marginLeft:8,flexShrink:0}}>
            <span style={{color:CS.accent,fontWeight:800,fontSize:14}}>⭐ {totalPoints}</span>
          </div>
        </div>

        {/* Toggle liste/carte */}
        <div style={{display:"flex",gap:8,marginBottom:tab==="offres"?10:0}}>
          {[{v:"list",l:"📋 Liste"},{v:"map",l:"🗺️ Carte"}].map(m=>(
            <button key={m.v} onClick={()=>setViewMode(m.v)}
              style={{flex:1,padding:"7px 0",borderRadius:8,border:`1.5px solid ${viewMode===m.v?CS.accent:"#E8E8E8"}`,background:viewMode===m.v?CS.accentSoft:"transparent",color:viewMode===m.v?CS.accent:CS.muted,fontSize:12,fontWeight:viewMode===m.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
              {m.l}
            </button>
          ))}
        </div>

        {/* Filtres type — seulement en mode offres */}
        {tab==="offres"&&(
          <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>
            {allTypes.map(t=>{
              const tm=t!=="Toutes"?getTypeMetier(t):null;
              return(
                <button key={t} onClick={()=>setFilter(t)}
                  style={{whiteSpace:"nowrap",padding:"5px 12px",borderRadius:20,border:`1.5px solid ${filter===t?CS.accent:"#E8E8E8"}`,background:filter===t?CS.accentSoft:"transparent",color:filter===t?CS.accent:CS.muted,fontSize:11,fontWeight:filter===t?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                  {tm&&tm.emoji} {t==="Toutes"?"Toutes":tm?.label||t}
                </button>
              );
            })}
          </div>
        )}
      </div>

      {/* Contenu */}
      <div style={{flex:1,overflowY:"auto",paddingBottom:20}}>
        {/* Carte — toujours montée, masquée si liste */}
        <div style={{display:viewMode==="map"?"block":"none",height:320}}>
          <LeafletMapConnecte
            offres={offresAffichees} selected={selected}
            onSelect={setSelected} city={city}
            height={320} userLocation={userLocation}
            visible={viewMode==="map"}/>
        </div>

        {/* Loading */}
        {loading&&(
          <div style={{textAlign:"center",padding:"40px 0",color:CS.muted}}>
            <div style={{width:32,height:32,border:"3px solid #E8E8E8",borderTopColor:CS.accent,borderRadius:"50%",margin:"0 auto 12px",animation:"spin 0.8s linear infinite"}}/>
            Chargement…
          </div>
        )}

        {/* Fiche détail */}
        {selected&&viewMode==="list"&&(
          <div style={{padding:"12px 16px 0",animation:"fadeUp 0.2s ease"}}>
            <OffreDetail offre={selected} etudiant={etudiant}
              isFavori={favIds.has(selected.id)}
              onToggleFavori={()=>toggleFavori(selected)}
              onClose={()=>setSelected(null)}
              onQR={()=>{setQrOffre(selected);setShowQR(true);}}/>
          </div>
        )}

        {/* Liste */}
        {!loading&&viewMode==="list"&&(
          <div style={{padding:"12px 16px 0"}}>
            {offresAffichees.length===0&&(
              <div style={{textAlign:"center",padding:"48px 20px",color:CS.muted}}>
                <div style={{fontSize:48,marginBottom:12}}>{tab==="favoris"?"❤️":"🎯"}</div>
                <div style={{color:CS.text,fontWeight:700,fontSize:15,marginBottom:6}}>
                  {tab==="favoris"?"Aucun favori":"Aucune offre disponible"}
                </div>
                <div style={{fontSize:13}}>{tab==="favoris"?"Sauvegardez des offres depuis la liste":"Essayez une autre ville"}</div>
              </div>
            )}
            {offresAffichees.map(o=>{
              const type=getTypeMetier(o.type_offre);
              const isFav=favIds.has(o.id);
              return(
                <div key={o.id} onClick={()=>setSelected(selected?.id===o.id?null:o)}
                  style={{background:"#FFFFFF",borderRadius:20,marginBottom:14,cursor:"pointer",overflow:"hidden",boxShadow:selected?.id===o.id?"0 4px 20px rgba(0,102,255,0.18)":"0 2px 12px rgba(0,0,0,0.07)",border:selected?.id===o.id?"2px solid "+CS.accent:"2px solid transparent",transition:"all 0.15s"}}>
                  {/* Bannière */}
                  <div style={{height:100,background:bannerColorSiok(o.titre),display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
                    {o.photos&&o.photos.length>0
                      ?<img src={o.photos[0].url} alt={o.titre} onError={e=>e.target.style.display="none"} style={{width:"100%",height:"100%",objectFit:"cover",position:"absolute",inset:0}}/>
                      :<span style={{fontSize:40}}>{type.emoji}</span>
                    }
                    <div style={{position:"absolute",top:8,right:10,background:CS.accent,color:"white",fontSize:13,fontWeight:900,padding:"3px 10px",borderRadius:20,animation:"pulse 2s ease-in-out infinite"}}>
                      -{o.promo_pct}%
                    </div>
                    <div style={{position:"absolute",top:8,left:10,background:"rgba(0,0,0,0.45)",color:"white",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>
                      {type.emoji} {type.label}
                    </div>
                    <button onClick={e=>{e.stopPropagation();toggleFavori(o);}}
                      style={{position:"absolute",bottom:8,right:10,width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,0.9)",border:"none",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {isFav?"❤️":"🤍"}
                    </button>
                    <button onClick={e=>{e.stopPropagation();setQrOffre(o);setShowQR(true);}}
                      style={{position:"absolute",bottom:8,left:10,padding:"4px 10px",borderRadius:12,background:"rgba(255,255,255,0.9)",border:"none",cursor:"pointer",fontSize:11,fontWeight:700,color:"#1F1F1F"}}>
                      📱 QR
                    </button>
                  </div>
                  {/* Infos */}
                  <div style={{padding:"10px 14px 12px"}}>
                    <div style={{color:CS.text,fontWeight:800,fontSize:15,marginBottom:2}}>{o.titre}</div>
                    <div style={{color:CS.muted,fontSize:12,marginBottom:6}}>{o.prestataire_nom} · {o.adresse}</div>
                    <div style={{display:"flex",alignItems:"center",gap:10,fontSize:12,flexWrap:"wrap"}}>
                      {o.prix&&<span style={{color:CS.accent,fontWeight:800,fontSize:14}}>{o.prix}€</span>}
                      {userLocation&&o.lat&&<span style={{color:CS.muted}}>📍 {(distanceM(userLocation.lat,userLocation.lng,o.lat,o.lng)/1000).toFixed(1)}km</span>}
                      <span style={{color:o.permanente?"#22C55E":"#F97316",fontWeight:600}}>
                        {o.permanente?"Permanente":"⏰ "+fmtDate(o.date_fin)}
                      </span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Onglet Visites / Historique */}
        {tab==="visites"&&(
          <div style={{padding:"0 16px"}}>
            <div style={{background:CS.accentSoft,borderRadius:12,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{color:CS.text,fontWeight:800,fontSize:16}}>⭐ {totalPoints} points</div>
                <div style={{color:CS.muted,fontSize:12,marginTop:2}}>{visites.length} visite{visites.length>1?"s":""} enregistrée{visites.length>1?"s":""}</div>
              </div>
              <div style={{fontSize:32}}>🏆</div>
            </div>
            {visites.length===0&&(
              <div style={{textAlign:"center",padding:"40px 0",color:CS.muted}}>
                <div style={{fontSize:40,marginBottom:12}}>📋</div>
                <div style={{color:CS.text,fontWeight:700,marginBottom:6}}>Aucune visite</div>
                <div style={{fontSize:13}}>Scannez un QR chez un prestataire pour enregistrer votre visite</div>
              </div>
            )}
            {visites.map(v=>{
              const type=getTypeMetier(v.offres?.type_offre||"autre");
              return(
                <div key={v.id} style={{background:"#FFFFFF",borderRadius:14,padding:"12px 16px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:44,height:44,borderRadius:12,background:bannerColorSiok(v.offres?.titre||""),display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
                      {type.emoji}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{color:CS.text,fontWeight:700,fontSize:14}}>{v.offres?.titre||"Offre"}</div>
                      <div style={{color:CS.muted,fontSize:12}}>{v.prestataires?.nom||"Prestataire"}</div>
                      <div style={{color:CS.muted,fontSize:11,marginTop:2}}>
                        {new Date(v.created_at).toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"})} · {new Date(v.created_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
                      </div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      {v.offres?.prix&&<div style={{color:CS.accent,fontWeight:800,fontSize:14}}>{v.offres.prix}€</div>}
                      <div style={{color:"#22C55E",fontSize:11,fontWeight:700}}>+{v.points_credites}pt</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      </div>

      {/* QR Generator */}
      {showQR&&qrOffre&&(
        <QRGenerator offre={qrOffre} etudiant={etudiant} onClose={()=>{setShowQR(false);setQrOffre(null);}}/>
      )}
    </div>
  );
}

/* ══ FICHE DÉTAIL OFFRE ══════════════════════════════ */
function OffreDetail({offre,etudiant,isFavori,onToggleFavori,onClose,onQR}){
  const type=getTypeMetier(offre.type_offre);
  return(
    <div style={{background:"#FFFFFF",borderRadius:20,marginBottom:16,overflow:"hidden",boxShadow:"0 4px 20px rgba(0,0,0,0.1)",animation:"fadeUp 0.2s ease"}}>
      <div style={{height:130,background:bannerColorSiok(offre.titre),display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
        {offre.photos&&offre.photos.length>0
          ?<img src={offre.photos[0].url} alt="" onError={e=>e.target.style.display="none"} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
          :<span style={{fontSize:52}}>{type.emoji}</span>
        }
        <button onClick={onClose} style={{position:"absolute",top:10,right:10,width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,0.9)",border:"none",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        <div style={{position:"absolute",top:10,left:10,background:CS.accent,color:"white",fontSize:13,fontWeight:900,padding:"4px 12px",borderRadius:20}}>-{offre.promo_pct}%</div>
      </div>
      <div style={{padding:"14px 16px 16px"}}>
        <div style={{color:CS.text,fontWeight:900,fontSize:17,letterSpacing:-0.3,marginBottom:2}}>{offre.titre}</div>
        <div style={{color:CS.muted,fontSize:13,marginBottom:4}}>{offre.prestataire_nom} · {offre.adresse}</div>
        {offre.description&&<div style={{color:CS.text,fontSize:13,lineHeight:1.6,padding:"10px 12px",background:"#F8F8F8",borderRadius:10,marginBottom:12}}>{offre.description}</div>}
        <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
          {offre.prix&&<div style={{background:CS.accentSoft,borderRadius:10,padding:"6px 14px",textAlign:"center"}}>
            <div style={{color:CS.accent,fontWeight:900,fontSize:17}}>{offre.prix}€</div>
            <div style={{color:CS.muted,fontSize:10}}>Prix promo</div>
          </div>}
          {!offre.permanente&&offre.date_fin&&<div style={{background:"#FFF8F0",borderRadius:10,padding:"6px 14px",textAlign:"center"}}>
            <div style={{color:"#F97316",fontWeight:700,fontSize:12}}>⏰ jusqu'au</div>
            <div style={{color:CS.text,fontWeight:700,fontSize:12}}>{fmtDate(offre.date_fin)}</div>
          </div>}
        </div>

        {/* Bouton QR principal */}
        <button onClick={onQR}
          style={{width:"100%",padding:"14px 0",borderRadius:14,border:"none",background:CS.accent,color:"white",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"inherit",marginBottom:10,boxShadow:`0 4px 14px ${CS.accentGlow}`,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          <span style={{fontSize:20}}>📱</span>
          Générer mon QR code de présence
        </button>

        <div style={{background:"#F0F6FF",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:12,color:CS.muted,lineHeight:1.6}}>
          🎓 Présentez votre QR au prestataire. Payez directement sur place.
          {etudiant&&<span style={{color:"#22C55E",fontWeight:600}}> +1 point crédité !</span>}
        </div>

        {offre.menu_url&&(
          <a href={offre.menu_url} target="_blank" rel="noopener"
            style={{display:"block",textAlign:"center",padding:"10px 0",borderRadius:12,background:"#F8F8F8",color:CS.text,fontSize:13,fontWeight:700,textDecoration:"none",marginBottom:10}}>
            📋 Voir le détail de l'offre →
          </a>
        )}
        {onToggleFavori&&<button onClick={onToggleFavori}
          style={{width:"100%",padding:"11px 0",borderRadius:12,border:"1.5px solid #E8E8E8",background:isFavori?"#FFF0F5":"transparent",color:isFavori?"#EC4899":CS.muted,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
          {isFavori?"❤️ Retirer des favoris":"🤍 Sauvegarder en favori"}
        </button>}
      </div>
    </div>
  );
}

/* ══ COMPTE ÉTUDIANT ═════════════════════════════════ */
function EtudiantDashboard({onBack,onHome,onConnecte}){
  const [authStep,setAuthStep]=useState("phone");
  const [phone,setPhone]=useState("");
  const [indicatif,setIndicatif]=useState("+33");
  const [otp,setOtp]=useState(["","","","","",""]);
  const [etudiant,setEtudiant]=useState(null);
  const [offres,setOffres]=useState([]);
  const [favoris,setFavoris]=useState([]);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [tab,setTab]=useState("favoris");
  const otpRefs=useRef([]);

  const sendOTP=async()=>{
    setError("");setLoading(true);
    try{
      const tel=indicatif+phone.replace(/\s/g,"").replace(/^0/,"");
      const {data:e}=await db().from("etudiants").select("*").eq("telephone",tel).maybeSingle();
      setEtudiant(e);
      // Simulation SMS en mode test
      if(TEST_MODE()) console.log("🧪 Code OTP: 123456");
      setAuthStep("otp");
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const verifyOTP=async()=>{
    const code=otp.join("");
    if(!TEST_MODE()&&code!=="123456"){setError("Code incorrect");return;}
    setLoading(true);
    if(!etudiant){
      // Nouveau compte
      setAuthStep("register");
      setLoading(false);
      return;
    }
    await loadDashboard(etudiant.id);
    if(onConnecte){onConnecte(etudiant);}
    else{setAuthStep("dashboard");}
    setLoading(false);
  };

  const register=async(form,photoFile)=>{
    setLoading(true);setError("");
    try{
      const tel=indicatif+phone.replace(/\s/g,"").replace(/^0/,"");
      // 1. Créer le compte étudiant d'abord
      const {data:e,error:err}=await db().from("etudiants").insert({
        prenom:form.prenom,telephone:tel,email:form.email||null,
        numero_ine:form.ine||null,etablissement:form.etablissement||null,
        photo_carte_url:null, // sera mis à jour après l'upload
        statut_validation:"en_attente",
      }).select().single();
      if(err)throw err;

      // 2. Uploader la photo APRÈS que le compte existe (évite les erreurs RLS)
      let photoUrl=null;
      if(photoFile){
        try{
          const path=`${e.id}/${Date.now()}_${photoFile.name.replace(/[^a-z0-9.]/gi,"_")}`;
          const {error:upErr}=await db().storage.from("student-cards").upload(path,photoFile,{contentType:photoFile.type,upsert:false});
          if(!upErr){
            photoUrl=`${window.SUPABASE_URL}/storage/v1/object/public/student-cards/${path}`;
            await db().from("etudiants").update({photo_carte_url:photoUrl}).eq("id",e.id);
          }else{
            console.warn("Upload photo optionnel échoué:",upErr.message);
          }
        }catch(photoErr){
          console.warn("Upload photo ignoré:",photoErr.message);
          // Non bloquant — le compte est créé sans photo
        }
      }

      const etudiantComplet={...e,photo_carte_url:photoUrl};
      setEtudiant(etudiantComplet);
      if(onConnecte){onConnecte(etudiantComplet);}
      else{setAuthStep("dashboard"); await loadDashboard(e.id);}
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const loadDashboard=async(id)=>{
    setLoading(true);
    try{
      const {data:favData}=await db().from("favoris")
        .select("*, offres(*, prestataires(nom,adresse,lat,lng,type_metier))")
        .eq("etudiant_id",id);
      if(favData){
        setFavoris(favData.map(f=>({
          ...f.offres,
          prestataire_nom:f.offres?.prestataires?.nom,
          adresse:f.offres?.prestataires?.adresse,
          fav_id:f.id,
        })));
      }
    }catch(e){console.error(e);}
    setLoading(false);
  };

  if(authStep==="phone") return(
    <StudentPageShell onBack={onBack} backLabel="Accueil">
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:16}}>🎓</div>
        <div style={{color:CS.text,fontSize:26,fontWeight:900,marginBottom:6,letterSpacing:-0.5}}>Mon compte</div>
        <div style={{color:CS.muted,fontSize:14,marginBottom:28,lineHeight:1.6}}>Connectez-vous ou créez votre compte étudiant</div>
        <TelInput label="Téléphone mobile" value={phone} onChange={setPhone} indicatif={indicatif} onIndicatifChange={setIndicatif} required={true}/>
        {TEST_MODE()&&<div style={{background:"#EEF3FF",borderRadius:10,padding:"8px 14px",marginBottom:14,color:"#0066FF",fontSize:12}}>🧪 Code test : <strong>123456</strong></div>}
        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <StudentBtn onClick={sendOTP} disabled={phone.replace(/\s/g,"").length<9} loading={loading}>
          Recevoir mon code →
        </StudentBtn>
      </div>
    </StudentPageShell>
  );

  if(authStep==="otp") return(
    <StudentPageShell onBack={()=>{setAuthStep("phone");setError("");setOtp(["","","","","",""]);}} backLabel="Modifier">
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:12}}>💬</div>
        <div style={{color:CS.text,fontSize:26,fontWeight:900,marginBottom:6,letterSpacing:-0.5}}>Code envoyé !</div>
        {etudiant?.prenom&&<div style={{color:"#22C55E",fontSize:14,fontWeight:700,marginBottom:24}}>Bonjour {etudiant.prenom} 👋</div>}
        <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:28}}>
          {otp.map((d,i)=>(
            <input key={i} ref={el=>otpRefs.current[i]=el} value={d}
              onChange={e=>{const v=e.target.value.replace(/\D/g,"").slice(-1);const nc=[...otp];nc[i]=v;setOtp(nc);if(v&&i<5)otpRefs.current[i+1]?.focus();}}
              onKeyDown={e=>{if(e.key==="Backspace"&&!d&&i>0){otpRefs.current[i-1]?.focus();const nc=[...otp];nc[i-1]="";setOtp(nc);}}}
              maxLength={1} type="number"
              style={{width:48,height:58,borderRadius:14,textAlign:"center",fontSize:24,fontWeight:700,background:"#FFFFFF",border:`2px solid ${d?CS.accent:"#E8E8E8"}`,color:CS.text,outline:"none",fontFamily:"monospace",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}/>
          ))}
        </div>
        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <StudentBtn onClick={verifyOTP} disabled={otp.join("").length<6} loading={loading}>Accéder à mon compte →</StudentBtn>
        <div style={{marginTop:16,color:CS.muted,fontSize:13}}>Pas reçu ? <span style={{color:CS.accent,cursor:"pointer",fontWeight:600}} onClick={sendOTP}>Renvoyer</span></div>
      </div>
    </StudentPageShell>
  );

  if(authStep==="register") return <EtudiantRegister indicatif={indicatif} phone={phone} onRegister={register} onBack={()=>setAuthStep("otp")} loading={loading} error={error}/>;

  // Dashboard
  return(
    <StudentPageShell onBack={onBack} backLabel="Accueil" topSlot={
      <div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,background:"#F0FFF4",borderRadius:10,padding:"8px 12px"}}>
          <span style={{fontSize:16}}>🎓</span>
          <span style={{color:"#22C55E",fontSize:13,fontWeight:700}}>{etudiant?.prenom}</span>
          <FiabiliteBadge statut={etudiant?.statut_validation||"en_attente"} small={true}/>
        </div>
        <div style={{display:"flex",gap:8,marginTop:10}}>

// Génère un token simple HMAC-like (sans crypto subtile pour compatibilité)
function genQRToken(offreId, etudiantId, ts){
  const str = `${offreId}|${etudiantId||"anon"}|${ts}|SIOK_SECRET`;
  let h = 0;
  for(let i=0; i<str.length; i++){
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(36).toUpperCase().padStart(8,"0");
}

function genQRData(offreId, etudiantId){
  const ts = Date.now();
  const token = genQRToken(offreId, etudiantId, ts);
  return JSON.stringify({
    type:"siok_visite",
    offre_id:offreId,
    etudiant_id:etudiantId||null,
    ts,
    token,
    exp:ts + 30*60*1000, // 30 minutes
  });
}

function validateQRData(data){
  try{
    const obj = JSON.parse(data);
    if(obj.type !== "siok_visite") return null;
    if(Date.now() > obj.exp) return {error:"QR code expiré (30 min dépassées)"};
    const expected = genQRToken(obj.offre_id, obj.etudiant_id, obj.ts);
    if(expected !== obj.token) return {error:"QR code invalide"};
    return obj;
  }catch(e){ return null; }
}

/* ══ CARTE LOCALISATION INSCRIPTION ════════════════ */
function LeafletLocator({lat,lng,onMove,city}){
  const mapRef=useRef(null);
  const mapObj=useRef(null);
  const markerRef=useRef(null);
  const cityData=CITIES.find(c=>c.id===city)||CITIES[0];
  const initLat=lat||cityData.lat;
  const initLng=lng||cityData.lng;

  useEffect(()=>{
    if(mapObj.current)return;
    mapObj.current=L.map(mapRef.current,{zoomControl:true})
      .setView([initLat,initLng],15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:19}).addTo(mapObj.current);
    const icon=L.divIcon({
      className:"",
      html:'<div style="width:32px;height:32px;border-radius:50%;background:#0066FF;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid white;box-shadow:0 2px 8px rgba(0,102,255,0.5);">📍</div>',
      iconSize:[32,32],iconAnchor:[16,32],
    });
    markerRef.current=L.marker([initLat,initLng],{icon,draggable:true}).addTo(mapObj.current);
    markerRef.current.on("dragend",e=>{
      const pos=e.target.getLatLng();
      onMove(pos.lat,pos.lng);
    });
    mapObj.current.on("click",e=>{
      markerRef.current.setLatLng(e.latlng);
      onMove(e.latlng.lat,e.latlng.lng);
    });
    setTimeout(()=>mapObj.current&&mapObj.current.invalidateSize(),200);
  },[]);

  useEffect(()=>{
    if(!markerRef.current||!lat||!lng)return;
    markerRef.current.setLatLng([lat,lng]);
    mapObj.current&&mapObj.current.panTo([lat,lng]);
  },[lat,lng]);

  return <div ref={mapRef} style={{height:220,width:"100%",borderRadius:12,overflow:"hidden",marginTop:10}}/>;
}


/* ══ QR GENERATOR — Étudiant ════════════════════════ */
function QRGenerator({offre, etudiant, onClose}){
  const [qrUrl, setQrUrl] = useState("");
  const [expiry, setExpiry] = useState(null);
  const [timeLeft, setTimeLeft] = useState(30*60*1000);

  useEffect(()=>{
    const data = genQRData(offre.id, etudiant?.id||null);
    const encoded = encodeURIComponent(data);
    setQrUrl(`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encoded}&bgcolor=ffffff&color=000000&margin=2`);
    const exp = Date.now() + 30*60*1000;
    setExpiry(exp);

    const interval = setInterval(()=>{
      const left = exp - Date.now();
      setTimeLeft(Math.max(0, left));
      if(left <= 0) clearInterval(interval);
    }, 1000);
    return ()=>clearInterval(interval);
  },[offre.id]);

  const mins = Math.floor(timeLeft/60000);
  const secs = Math.floor((timeLeft%60000)/1000);
  const isExpired = timeLeft <= 0;
  const isWarning = timeLeft < 5*60*1000;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#FFFFFF",borderRadius:24,padding:"28px 24px",width:"100%",maxWidth:360,textAlign:"center",animation:"fadeUp 0.25s ease"}}>
        <button onClick={onClose} style={{position:"absolute",top:16,right:16,width:32,height:32,borderRadius:"50%",background:"#F0F0F0",border:"none",cursor:"pointer",fontSize:16}}>✕</button>

        <div style={{fontSize:32,marginBottom:8}}>📱</div>
        <div style={{color:"#1F1F1F",fontSize:18,fontWeight:900,marginBottom:4,letterSpacing:-0.3}}>{offre.titre}</div>
        <div style={{color:"#6B7280",fontSize:13,marginBottom:16}}>{offre.prestataire_nom}</div>

        {/* QR Code */}
        {!isExpired?(
          <div style={{background:"#F8F8F8",borderRadius:16,padding:16,marginBottom:16,display:"inline-block"}}>
            {qrUrl&&<img src={qrUrl} alt="QR" width={220} height={220} style={{borderRadius:8,display:"block"}}/>}
          </div>
        ):(
          <div style={{background:"#FFF0F0",borderRadius:16,padding:32,marginBottom:16}}>
            <div style={{fontSize:40,marginBottom:8}}>⏰</div>
            <div style={{color:"#EF4444",fontWeight:700}}>QR code expiré</div>
          </div>
        )}

        {/* Timer */}
        <div style={{
          background:isExpired?"#FFF0F0":isWarning?"#FFF8F0":"#F0F6FF",
          borderRadius:12,padding:"10px 16px",marginBottom:16,
          display:"flex",alignItems:"center",justifyContent:"space-between"
        }}>
          <span style={{color:isExpired?"#EF4444":isWarning?"#F97316":"#0066FF",fontSize:13,fontWeight:600}}>
            {isExpired?"Expiré":"⏱️ Valide encore"}
          </span>
          <span style={{color:isExpired?"#EF4444":isWarning?"#F97316":"#0066FF",fontWeight:900,fontSize:20,fontFamily:"monospace"}}>
            {isExpired?"00:00":`${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`}
          </span>
        </div>

        <div style={{color:"#6B7280",fontSize:12,lineHeight:1.6,marginBottom:16}}>
          Montrez ce QR code au prestataire qui le scannera pour valider votre visite.
          {etudiant&&<span style={{color:"#22C55E",fontWeight:600}}><br/>+1 point crédité après scan !</span>}
          {!etudiant&&<span style={{color:"#F97316"}}><br/>Créez un compte pour gagner des points.</span>}
        </div>

        {isExpired&&(
          <button onClick={()=>{
            const data = genQRData(offre.id, etudiant?.id||null);
            const encoded = encodeURIComponent(data);
            setQrUrl(`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encoded}&bgcolor=ffffff&color=000000&margin=2`);
            setExpiry(Date.now()+30*60*1000);
            setTimeLeft(30*60*1000);
          }} style={{width:"100%",padding:"12px 0",borderRadius:12,border:"none",background:CS.accent,color:"white",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>

          </button>
        )}
      </div>
    </div>
  );
}

/* ══ QR SCANNER — Prestataire ═══════════════════════ */
function QRScanner({prestataireId, onScanned, onClose}){
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const animRef = useRef(null);
  const [scanning, setScanning] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(()=>{
    startCamera();
    return ()=>stopCamera();
  },[]);

  const startCamera = async()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      streamRef.current = stream;
      if(videoRef.current){
        videoRef.current.srcObject = stream;
        videoRef.current.play();
        setScanning(true);
        animRef.current = requestAnimationFrame(scan);
      }
    }catch(e){ setError("Impossible d'accéder à la caméra: "+e.message); }
  };

  const stopCamera = ()=>{
    if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    if(animRef.current) cancelAnimationFrame(animRef.current);
  };

  const scan = ()=>{
    if(!videoRef.current||!canvasRef.current) return;
    const video = videoRef.current;
    if(video.readyState !== video.HAVE_ENOUGH_DATA){
      animRef.current = requestAnimationFrame(scan);
      return;
    }
    const canvas = canvasRef.current;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = window.jsQR&&window.jsQR(imageData.data, imageData.width, imageData.height);
    if(code){
      stopCamera();
      setScanning(false);
      processQR(code.data);
      return;
    }
    animRef.current = requestAnimationFrame(scan);
  };

  const processQR = async(data)=>{
    const qr = validateQRData(data);
    if(!qr){ setError(qr?.error||"QR code invalide ou non reconnu"); return; }
    if(qr.error){ setError(qr.error); return; }

    setSaving(true);
    try{
      // Récupérer l'offre
      const {data:offre} = await db().from("offres").select("titre,prix,promo_pct,prestataire_id").eq("id",qr.offre_id).single();

      // Enregistrer la visite
      await db().from("visites").insert({
        offre_id: qr.offre_id,
        prestataire_id: prestataireId,
        etudiant_id: qr.etudiant_id||null,
        etudiant_anon: !qr.etudiant_id,
        points_credites: qr.etudiant_id?1:0,
      });

      // Créditer le point si étudiant connecté
      if(qr.etudiant_id){
        await db().from("etudiants")
          .update({points: db().rpc("increment_points", {row_id: qr.etudiant_id})})
          .eq("id", qr.etudiant_id);
        // Fallback simple si RPC non disponible
        const {data:et} = await db().from("etudiants").select("points").eq("id",qr.etudiant_id).single().catch(()=>({data:null}));
        if(et) await db().from("etudiants").update({points:(et.points||0)+1}).eq("id",qr.etudiant_id);
      }

      setResult({offre, etudiant_id:qr.etudiant_id});
    }catch(e){ setError(e.message); }
    setSaving(false);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:3000,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      {!result&&!error&&(
        <div style={{width:"100%",maxWidth:340,textAlign:"center"}}>
          <div style={{color:"white",fontSize:18,fontWeight:800,marginBottom:20}}>📷 Scanner le QR étudiant</div>
          <div style={{position:"relative",borderRadius:20,overflow:"hidden",background:"#000",marginBottom:16}}>
            <video ref={videoRef} style={{width:"100%",display:"block"}} playsInline muted/>
            <canvas ref={canvasRef} style={{display:"none"}}/>
            {/* Viseur */}
            <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
              <div style={{width:200,height:200,border:"3px solid #0066FF",borderRadius:16,boxShadow:"0 0 0 2000px rgba(0,0,0,0.4)"}}/>
            </div>
          </div>
          <div style={{color:"rgba(255,255,255,0.6)",fontSize:13}}>Centrez le QR code dans le cadre bleu</div>
          {saving&&<div style={{color:"#0066FF",marginTop:12,fontSize:13,fontWeight:600}}>Validation en cours…</div>}
        </div>
      )}

      {error&&(
        <div style={{background:"#FFFFFF",borderRadius:20,padding:28,maxWidth:320,textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:12}}>❌</div>
          <div style={{color:"#EF4444",fontWeight:800,fontSize:16,marginBottom:8}}>{error}</div>
          <button onClick={()=>{setError("");startCamera();}}
            style={{padding:"10px 24px",borderRadius:12,border:"none",background:"#0066FF",color:"white",fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:10}}>
            Réessayer
          </button>
        </div>
      )}

      {result&&(
        <div style={{background:"#FFFFFF",borderRadius:20,padding:28,maxWidth:320,textAlign:"center",animation:"fadeUp 0.2s ease"}}>
          <div style={{fontSize:56,marginBottom:12}}>✅</div>
          <div style={{color:"#22C55E",fontWeight:900,fontSize:18,marginBottom:8}}>Visite validée !</div>
          <div style={{color:"#1F1F1F",fontWeight:700,fontSize:15,marginBottom:4}}>{result.offre?.titre}</div>
          <div style={{color:"#6B7280",fontSize:13,marginBottom:12}}>
            {result.offre?.prix&&`${result.offre.prix}€ · `}-{result.offre?.promo_pct}%
          </div>
          {result.etudiant_id?(
            <div style={{background:"rgba(34,197,94,0.1)",borderRadius:10,padding:"8px 14px",marginBottom:16,color:"#22C55E",fontSize:13,fontWeight:700}}>
              🎯 +1 point crédité à l'étudiant !
            </div>
          ):(
            <div style={{background:"#F8F8F8",borderRadius:10,padding:"8px 14px",marginBottom:16,color:"#6B7280",fontSize:12}}>
              Étudiant non connecté — visite comptée sans point
            </div>
          )}
          <button onClick={()=>{onScanned&&onScanned();onClose();}}
            style={{width:"100%",padding:"12px 0",borderRadius:12,border:"none",background:"#0066FF",color:"white",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            Fermer
          </button>
        </div>
      )}

      <button onClick={onClose}
        style={{position:"fixed",top:52,right:20,width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,0.15)",border:"none",color:"white",cursor:"pointer",fontSize:18}}>✕</button>
    </div>
  );
}

    duration:12,
    label:"45,90€/mois",
    sublabel:"550,80€ facturé annuellement",
    features:["Offres illimitées","Photos par offre","Statistiques avancées","Support prioritaire","Économisez 168€/an"],
    color:"#7C3AED",
    best:true,
  },
];

function planFin(planId){
  const now = new Date();
  const plan = SIOK_PLANS.find(p=>p.id===planId);
  if(!plan) return null;
  const fin = new Date(now);
  fin.setMonth(fin.getMonth() + plan.duration);
  return fin;
}

function planLabel(planId, planFin){
  if(!planId || planId==="trial") return "🎁 Essai gratuit";
  const p = SIOK_PLANS.find(pl=>pl.id===planId);
  const label = p ? p.name : planId;
  if(planFin){
    const fin = new Date(planFin);
    const today = new Date();
    const jours = Math.ceil((fin-today)/(1000*60*60*24));
    if(jours < 0) return `⚠️ ${label} — Expiré`;
    if(jours <= 7) return `⚠️ ${label} — ${jours}j restants`;
    return `⚡ ${label} — jusqu'au ${fin.toLocaleDateString("fr-FR")}`;
  }
  return `⚡ ${label}`;
}


/* ══ INSCRIPTION PRESTATAIRE ════════════════════════ */
function PrestataireRegister({onSuccess, onBack}){
  const [step,setStep]=useState(1); // 1 | 2 | 3
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");
  const [geoLoading,setGeoLoading]=useState(false);
  const [form,setForm]=useState({
    // Étape 1 — Compte
    email:"", password:"", nom_responsable:"", telephone:"",
    // Étape 2 — Enseigne
    nom:"", type_metier:"restaurant", siret:"",
    adresse:"", ville:"annecy", lat:null, lng:null,
    // Étape 3 — Plan
    plan:"trial",
  });
  const F=(k,v)=>setForm(f=>({...f,[k]:v}));

  const geocode=async()=>{
    if(!form.adresse)return;
    setGeoLoading(true);
    try{
      const cityData=CITIES.find(c=>c.id===form.ville)||CITIES[0];
      const q=encodeURIComponent(`${form.adresse}, ${cityData.name}, France`);
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`);
      const data=await r.json();
      if(data&&data[0]){
        F("lat",parseFloat(data[0].lat));
        F("lng",parseFloat(data[0].lon));
      }
    }catch(e){}
    setGeoLoading(false);
  };

  const geolocate=()=>{
    navigator.geolocation?.getCurrentPosition(p=>{
      F("lat",p.coords.latitude);
      F("lng",p.coords.longitude);
    });
  };

  const submit=async()=>{
    setSaving(true);setError("");
    try{
      // 1. Créer le compte Auth
      const {data:authData,error:authErr}=await db().auth.signUp({
        email:form.email, password:form.password,
        options:{emailRedirectTo:window.location.href}
      });
      if(authErr)throw authErr;
      const authId=authData.user?.id;
      if(!authId)throw new Error("Erreur création compte");

      // 2. Calculer les dates de plan
      const debut=new Date();
      const fin=planFin(form.plan);

      // 3. Insérer le prestataire
      const {error:dbErr}=await db().from("prestataires").insert({
        auth_id:authId,
        nom:form.nom,
        type_metier:form.type_metier,
        siret:form.siret||null,
        nom_responsable:form.nom_responsable||null,
        email:form.email,
        telephone:form.telephone||null,
        adresse:form.adresse||null,
        ville:CITIES.find(c=>c.id===form.ville)?.name||form.ville,
        lat:form.lat||null,
        lng:form.lng||null,
        plan:form.plan,
        plan_debut:debut.toISOString(),
        plan_fin:fin?.toISOString()||null,
      });
      if(dbErr)throw dbErr;

      onSuccess(authData.user);
    }catch(e){setError(e.message);}
    setSaving(false);
  };

  const inp=(label,key,placeholder,type="text",required=false)=>(
    <div style={{marginBottom:14}}>
      <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>
        {label}{required&&<span style={{color:"#ef4444",marginLeft:3}}>*</span>}
      </div>
      <input type={type} value={form[key]||""} onChange={e=>F(key,e.target.value)} placeholder={placeholder}
        style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",color:C.text,fontSize:14,fontFamily:"inherit",outline:"none"}}/>
    </div>
  );

  // Étape 1 — Compte
  if(step===1) return(
    <PrestPageShell onBack={onBack} backLabel="Retour" stickyHeader={false}>
      <div style={{padding:"20px"}}>
        <div style={{display:"flex",gap:6,marginBottom:20}}>
          {[1,2,3].map(s=>(
            <div key={s} style={{flex:1,height:4,borderRadius:2,background:s<=step?"#0066FF":"rgba(255,255,255,0.1)"}}/>
          ))}
        </div>
        <div style={{color:C.text,fontSize:20,fontWeight:800,marginBottom:4}}>Créer mon compte</div>
        <div style={{color:C.muted,fontSize:13,marginBottom:20}}>Étape 1 / 3 — Informations de connexion</div>

        {inp("Email *","email","votre@email.com","email",true)}
        {inp("Mot de passe *","password","Min. 8 caractères","password",true)}
        {inp("Nom du responsable","nom_responsable","Jean Dupont")}
        {inp("Téléphone","telephone","+33450...")}

        {error&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:8,padding:"10px 12px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <Btn onClick={()=>{
          if(!form.email||!form.password)return setError("Email et mot de passe obligatoires");
          if(form.password.length<8)return setError("Mot de passe : 8 caractères minimum");
          setError("");setStep(2);
        }}>Étape suivante →</Btn>
      </div>
    </PrestPageShell>
  );

  // Étape 2 — Enseigne + localisation
  if(step===2) return(
    <PrestPageShell onBack={()=>{setStep(1);setError("");}} backLabel="← Étape 1" stickyHeader={false}>
      <div style={{padding:"20px"}}>
        <div style={{display:"flex",gap:6,marginBottom:20}}>
          {[1,2,3].map(s=>(
            <div key={s} style={{flex:1,height:4,borderRadius:2,background:s<=step?"#0066FF":"rgba(255,255,255,0.1)"}}/>
          ))}
        </div>
        <div style={{color:C.text,fontSize:20,fontWeight:800,marginBottom:4}}>Votre enseigne</div>

        {inp("Nom de l'enseigne *","nom","Ex: Danzo Barber, Cappadoce…",undefined,true)}
        {inp("SIRET","siret","14 chiffres")}

        {/* Type métier */}
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Type de métier *</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {TYPES_METIER.map(t=>(
              <button key={t.id} onClick={()=>F("type_metier",t.id)}
                style={{padding:"8px 14px",borderRadius:10,border:`1px solid ${form.type_metier===t.id?"rgba(0,102,255,0.5)":C.border}`,background:form.type_metier===t.id?"rgba(0,102,255,0.12)":"transparent",color:form.type_metier===t.id?"#0066FF":C.muted,fontSize:13,fontWeight:form.type_metier===t.id?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                {t.emoji} {t.label}
              </button>
            ))}
          </div>
        </div>

        {/* Ville */}
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Ville *</div>
          <select value={form.ville} onChange={e=>F("ville",e.target.value)}
            style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",color:C.text,fontSize:14,fontFamily:"inherit",outline:"none"}}>
            {CITIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>

        {/* Adresse + géocodage */}
        <div style={{marginBottom:6}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Adresse</div>
          <div style={{display:"flex",gap:8}}>
            <input value={form.adresse||""} onChange={e=>F("adresse",e.target.value)} placeholder="12 Rue de la Gare"
              style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",color:C.text,fontSize:14,fontFamily:"inherit",outline:"none"}}/>
            <button onClick={geocode} disabled={geoLoading}
              style={{padding:"0 14px",borderRadius:10,border:`1px solid ${C.border}`,background:"rgba(0,102,255,0.1)",color:"#0066FF",fontSize:13,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
              {geoLoading?"…":"🔍 Chercher"}
            </button>
          </div>
        </div>
        <button onClick={geolocate}
          style={{width:"100%",padding:"10px",borderRadius:10,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit",marginBottom:8}}>
          📍 Utiliser ma position actuelle
        </button>

        {/* Carte localisation */}
        <LeafletLocator lat={form.lat} lng={form.lng} city={form.ville}
          onMove={(lat,lng)=>{F("lat",lat);F("lng",lng);}}/>
        {form.lat&&<div style={{color:C.muted,fontSize:11,marginTop:4,textAlign:"center"}}>
          📍 {form.lat.toFixed(5)}, {form.lng.toFixed(5)}
        </div>}

        <div style={{marginTop:14}}>
          {error&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:8,padding:"10px 12px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
          <Btn onClick={()=>{

        </div>
      </div>
    </PrestPageShell>
  );

  // Étape 3 — Plan abonnement
  return(
    <PrestPageShell onBack={()=>{setStep(2);setError("");}} backLabel="← Étape 2" stickyHeader={false}>
      <div style={{padding:"20px"}}>

          {[1,2,3].map(s=>(
            <div key={s} style={{flex:1,height:4,borderRadius:2,background:s<=step?"#0066FF":"rgba(255,255,255,0.1)"}}/>

function PrestataireLogin({onSuccess,onBack}){
  const [subScreen,setSubScreen]=useState("login"); // login | register
  const [form,setForm]=useState({email:"",password:""});
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const login=async()=>{
    setError("");setLoading(true);
    try{
      const {data,error:err}=await db().auth.signInWithPassword({email:form.email,password:form.password});
      if(err)throw err;
      onSuccess(data.user);
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  if(subScreen==="register") return(
    <PrestataireRegister
      onSuccess={onSuccess}
      onBack={()=>setSubScreen("login")}
    />
  );

  return(
    <PrestPageShell onBack={onBack} backLabel="Accueil">
      <div style={{padding:"32px 20px"}}>
        <div style={{fontSize:40,marginBottom:12,textAlign:"center"}}>🏪</div>
        <div style={{color:C.text,fontSize:24,fontWeight:800,marginBottom:4,textAlign:"center"}}>Espace prestataire</div>
        <div style={{color:C.muted,fontSize:13,marginBottom:28,textAlign:"center"}}>Gérez vos offres étudiantes</div>
        <FInput label="Email" type="email" value={form.email} onChange={v=>setForm(f=>({...f,email:v}))} placeholder="votre@email.com" required={true}/>
        <FInput label="Mot de passe" type="password" value={form.password} onChange={v=>setForm(f=>({...f,password:v}))} placeholder="••••••••" required={true}/>
        {error&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <Btn onClick={login} disabled={!form.email||!form.password} loading={loading}>Se connecter</Btn>

          </button>
        </div>
      </div>
    </PrestPageShell>
  );
}

function PrestataireDashboard({user,onLogout,onHome}){

  useEffect(()=>{loadPrestataires();},[]);

  const loadPrestataires=async()=>{
    setLoading(true);
    try{
      const {data}=await db().from("prestataires").select("*").eq("auth_id",user.id);
      if(data&&data.length>0){
        setPrestataires(data);
        setActive(data[0]);

        await loadVisites(data[0].id);
      }
    }catch(e){console.error(e);}

  const loadOffres=async(prestId)=>{
    const {data}=await db().from("offres").select("*").eq("prestataire_id",prestId).order("created_at",{ascending:false});
    setOffres(data||[]);
  };

  const toggleOffre=async(offre)=>{
    const next=!offre.active;
    await db().from("offres").update({active:next}).eq("id",offre.id);
    setOffres(os=>os.map(o=>o.id===offre.id?{...o,active:next}:o));

/* ══ PHOTOS MANAGER OFFRE ═══════════════════════════ */
function OffrePhotosManager({offreId, photos, onUpdate}){
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState("");
  const MAX = 5;
  const list = Array.isArray(photos) ? photos : [];

  const compressAndUpload = async(file) => {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      img.onload = () => {
        const MAX_PX = 1200;
        let w = img.width, h = img.height;
        if(w > MAX_PX){ h = Math.round(h * MAX_PX / w); w = MAX_PX; }
        if(h > MAX_PX){ w = Math.round(w * MAX_PX / h); h = MAX_PX; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if(!blob) return reject(new Error("Compression échouée"));
          resolve(blob);
        }, "image/jpeg", 0.82);
      };
      img.onerror = () => reject(new Error("Image invalide"));
      reader.readAsDataURL(file);
    });
  };

  const handleFiles = async(files) => {
    setError(""); setUploading(true);
    try{
      let current = [...list];
      for(const file of Array.from(files)){
        if(current.length >= MAX){ setError(`Maximum ${MAX} photos`); break; }
        if(!file.type.startsWith("image/")) continue;
        const blob = await compressAndUpload(file);
        const path = `${offreId||"new"}/${Date.now()}_${file.name.replace(/[^a-z0-9.]/gi,"_")}`;
        const {error:upErr} = await db().storage.from("siok-offer-photos").upload(path, blob, {contentType:"image/jpeg",upsert:false});
        if(upErr) throw new Error(upErr.message);
        const publicUrl = `${window.SUPABASE_URL}/storage/v1/object/public/siok-offer-photos/${path}`;
        current.push({url:publicUrl, path, ordre:current.length});
      }
      current = current.map((p,i)=>({...p,ordre:i}));
      if(offreId){
        await db().from("offres").update({photos:current}).eq("id",offreId);
      }
      onUpdate(current);
    }catch(e){ setError(e.message); }
    setUploading(false);
  };

  const remove = async(idx) => {
    if(!window.confirm("Supprimer cette photo ?")) return;
    setUploading(true);
    try{
      const p = list[idx];
      if(p.path) await db().storage.from("siok-offer-photos").remove([p.path]);
      const next = list.filter((_,i)=>i!==idx).map((x,i)=>({...x,ordre:i}));
      if(offreId) await db().from("offres").update({photos:next}).eq("id",offreId);
      onUpdate(next);
    }catch(e){ setError(e.message); }
    setUploading(false);
  };

  const move = async(idx, dir) => {
    const next = [...list];
    const swap = idx + dir;
    if(swap < 0 || swap >= next.length) return;
    [next[idx], next[swap]] = [next[swap], next[idx]];
    const reindexed = next.map((x,i)=>({...x,ordre:i}));
    if(offreId) await db().from("offres").update({photos:reindexed}).eq("id",offreId);
    onUpdate(reindexed);
  };

  return(
    <div style={{marginBottom:14}}>
      <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
        📸 Photos de l'offre ({list.length}/{MAX})
      </div>
      {list.length > 0 && (
        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
          {list.map((p,i)=>(
            <div key={p.url} style={{display:"flex",alignItems:"center",gap:8,background:C.surface,borderRadius:10,padding:6,border:`1px solid ${C.border}`}}>
              <img src={p.url} alt="" onError={e=>e.target.style.display="none"} style={{width:64,height:46,objectFit:"cover",borderRadius:6,flexShrink:0}}/>
              <div style={{flex:1,color:C.sub,fontSize:11}}>{i===0?"⭐ Principale":"Photo "+(i+1)}</div>
              <div style={{display:"flex",gap:4}}>
                <button onClick={()=>move(i,-1)} disabled={i===0||uploading} style={{width:26,height:26,borderRadius:6,border:`1px solid ${C.border}`,background:"transparent",color:C.sub,cursor:"pointer",fontSize:12,opacity:i===0?0.3:1}}>↑</button>
                <button onClick={()=>move(i,1)} disabled={i===list.length-1||uploading} style={{width:26,height:26,borderRadius:6,border:`1px solid ${C.border}`,background:"transparent",color:C.sub,cursor:"pointer",fontSize:12,opacity:i===list.length-1?0.3:1}}>↓</button>
                <button onClick={()=>remove(i)} disabled={uploading} style={{width:26,height:26,borderRadius:6,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.08)",color:"#ef4444",cursor:"pointer",fontSize:12}}>✕</button>
              </div>
            </div>
          ))}
        </div>
      )}
      {list.length < MAX && (
        <label style={{display:"block",border:`2px dashed ${C.accent}`,borderRadius:12,padding:"14px 0",textAlign:"center",cursor:"pointer",background:"rgba(0,102,255,0.04)"}}>
          <input type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
          <div style={{fontSize:24,marginBottom:4}}>📷</div>
          <div style={{color:C.accent,fontWeight:700,fontSize:12}}>{uploading?"Envoi…":"Ajouter des photos"}</div>
          <div style={{color:C.muted,fontSize:10,marginTop:2}}>JPG, PNG · max 500ko · {MAX-list.length} restant{MAX-list.length>1?"s":""}</div>
        </label>
      )}
      {error&&<div style={{color:"#ef4444",fontSize:11,marginTop:4}}>⚠️ {error}</div>}
    </div>
  );
}

/* ══ ÉDITEUR D'OFFRE ═════════════════════════════════ */
function OffreEditor({offre,prestataireId,onBack,onSaved}){
  const isNew=!offre;
  const [form,setForm]=useState({
    titre:offre?.titre||"",
    description:offre?.description||"",
    type_offre:offre?.type_offre||"restaurant",
    prix:offre?.prix||"",
    image_emoji:offre?.image_emoji||"🎯",
    permanente:offre?.permanente!==false,
    date_debut:offre?.date_debut?offre.date_debut.slice(0,10):"",
    date_fin:offre?.date_fin?offre.date_fin.slice(0,10):"",
    promo_pct:offre?.promo_pct||10,
    menu_url:offre?.menu_url||"",
  });
  const [photos,setPhotos]=useState(Array.isArray(offre?.photos)?offre.photos:[]);
  const [savedId,setSavedId]=useState(offre?.id||null);
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");

  const save=async()=>{
    if(!form.titre)return setError("Le titre est obligatoire");
    setSaving(true);setError("");
    try{
      const payload={
        ...form,
        prix:form.prix?parseFloat(form.prix):null,
        date_debut:form.permanente||!form.date_debut?null:new Date(form.date_debut).toISOString(),
        date_fin:form.permanente||!form.date_fin?null:new Date(form.date_fin).toISOString(),
        prestataire_id:prestataireId,
        photos:photos,
        active:true,
      };
      if(isNew){
        const {data:inserted,error:err}=await db().from("offres").insert(payload).select("id").single();
        if(err)throw err;
        setSavedId(inserted.id);
      }else{
        const {error:err}=await db().from("offres").update(payload).eq("id",offre.id);
        if(err)throw err;
      }
      onSaved();
    }catch(e){setError(e.message);}
    setSaving(false);
  };

  return(
    <PrestPageShell onBack={onBack} backLabel="← Mes offres" stickyHeader={false}>
      <div style={{padding:"20px"}}>
        <div style={{color:C.text,fontSize:20,fontWeight:800,marginBottom:16}}>{isNew?"Nouvelle offre":"Modifier l'offre"}</div>

        <FInput label="Titre de l'offre" value={form.titre} onChange={v=>setForm(f=>({...f,titre:v}))} placeholder="Ex: Coupe étudiant, Repas du jour…" required={true}/>
        <FInput label="Description (optionnel)" value={form.description} onChange={v=>setForm(f=>({...f,description:v}))} placeholder="Décrivez votre offre…"/>
        <FInput label="Prix promo (€)" type="number" value={form.prix} onChange={v=>setForm(f=>({...f,prix:v}))} placeholder="Ex: 8.50"/>
        <FInput label="URL détail offre (optionnel)" value={form.menu_url} onChange={v=>setForm(f=>({...f,menu_url:v}))} placeholder="https://…"/>

        {/* Type d'offre */}
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Type d'offre *</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {TYPES_METIER.map(t=>(
              <button key={t.id} onClick={()=>setForm(f=>({...f,type_offre:t.id}))}
                style={{padding:"8px 14px",borderRadius:10,border:`1px solid ${form.type_offre===t.id?C.accent:C.border}`,background:form.type_offre===t.id?C.accentSoft:"transparent",color:form.type_offre===t.id?C.accent:C.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:form.type_offre===t.id?700:400}}>
                {t.emoji} {t.label}
              </button>
            ))}
          </div>
        </div>

        {/* % remise */}
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>% de remise * <span style={{color:C.accent}}>({form.promo_pct}%)</span></div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {PROMO_PCTS.map(p=>(
              <button key={p} onClick={()=>setForm(f=>({...f,promo_pct:p}))}
                style={{padding:"8px 14px",borderRadius:10,border:`1px solid ${form.promo_pct===p?C.accent:C.border}`,background:form.promo_pct===p?C.accentSoft:"transparent",color:form.promo_pct===p?C.accent:C.muted,fontSize:13,fontWeight:form.promo_pct===p?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                -{p}%
              </button>
            ))}
          </div>
        </div>

        {/* Permanente / temporaire */}
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Durée</div>
          <div style={{display:"flex",gap:8}}>
            {[{v:true,l:"✓ Permanente"},{v:false,l:"⏰ Temporaire"}].map(opt=>(
              <button key={String(opt.v)} onClick={()=>setForm(f=>({...f,permanente:opt.v}))}
                style={{flex:1,padding:"10px 0",borderRadius:10,border:`1px solid ${form.permanente===opt.v?C.accent:C.border}`,background:form.permanente===opt.v?C.accentSoft:"transparent",color:form.permanente===opt.v?C.accent:C.muted,fontSize:13,fontWeight:form.permanente===opt.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                {opt.l}
              </button>
            ))}
          </div>
          {!form.permanente&&(
            <div style={{display:"flex",gap:10,marginTop:10}}>
              <div style={{flex:1}}>
                <FInput label="Date début" type="date" value={form.date_debut} onChange={v=>setForm(f=>({...f,date_debut:v}))}/>
              </div>
              <div style={{flex:1}}>
                <FInput label="Date fin" type="date" value={form.date_fin} onChange={v=>setForm(f=>({...f,date_fin:v}))}/>
              </div>
            </div>
          )}
        </div>

        {/* Photos de l'offre */}
        <OffrePhotosManager
          offreId={savedId}
          photos={photos}
          onUpdate={setPhotos}
        />

        {error&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}

        <Btn onClick={save} loading={saving}>
          {isNew?"Créer l'offre":"Sauvegarder les modifications"}
        </Btn>
      </div>
    </PrestPageShell>
  );
}

/* ══ ROOT ════════════════════════════════════════════ */
function App(){
  const [screen,setScreen]=useState("explorer"); // explorer | auth | etudiant-app | prestataire-login | prestataire-dashboard
  const [user,setUser]=useState(null);
  const [etudiant,setEtudiant]=useState(null);

  // Écran explorateur = carte non connectée (premier écran)
  if(screen==="explorer") return(
    <MapExplorer
      onConnecte={()=>setScreen("auth")}
      onPrestataire={()=>setScreen("prestataire-login")}
    />
  );

  // Auth étudiant
  if(screen==="auth") return(
    <EtudiantDashboard
      onBack={()=>setScreen("explorer")}
      onConnecte={(e)=>{setEtudiant(e);setScreen("etudiant-app");}}
    />
  );

  // App étudiant connecté
  if(screen==="etudiant-app") return(
    <EtudiantApp
      etudiant={etudiant}
      onLogout={()=>{setEtudiant(null);setScreen("explorer");}}
      onHome={()=>setScreen("etudiant-app")}
    />
  );

  // Prestataire
  if(screen==="prestataire-login") return(
    <PrestataireLogin
      onSuccess={(u)=>{setUser(u);setScreen("prestataire-dashboard");}}
      onBack={()=>setScreen("explorer")}
    />
  );

  if(screen==="prestataire-dashboard") return(
    <PrestataireDashboard
      user={user}
      onLogout={()=>{setUser(null);setScreen("explorer");}}
      onHome={()=>setScreen("explorer")}
    />
  );

  return <MapExplorer onConnecte={()=>setScreen("auth")} onPrestataire={()=>setScreen("prestataire-login")}/>;
}

function mountApp(){
  const loader=document.getElementById("splash-loader");
  const root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
  if(loader){
    loader.style.transition="opacity 0.5s";
    loader.style.opacity="0";
    setTimeout(()=>loader.style.display="none",600);
  }
}

loadParams().then(()=>mountApp());
  </script>
