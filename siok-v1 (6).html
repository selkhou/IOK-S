/* ══ HELPERS ═════════════════════════════════════════ */
function fmt(ms){
  if(ms<=0)return"00:00";
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);
  return`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function fmtDate(d){
  if(!d)return"";
  return new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
function fmtDateLong(d){
  if(!d)return"";
  return new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
}
function isOffreActive(offre){
  if(!offre.active)return false;
  if(!offre.permanente){
    const now=new Date();
    if(offre.date_debut&&new Date(offre.date_debut)>now)return false;
    if(offre.date_fin&&new Date(offre.date_fin)<now)return false;
  }
  return true;
}
function bannerColorSiok(str){
  let h=0;for(let i=0;i<(str||"").length;i++)h=(h*31+str.charCodeAt(i))>>>0;
  const hues=[200,220,240,260,180,210,230,250];
  return`hsl(${hues[h%hues.length]},55%,88%)`;
}
function getTypeMetier(id){
  return TYPES_METIER.find(t=>t.id===id)||TYPES_METIER[3];
}
function distanceM(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ══ CARTE OFFRES ════════════════════════════════════ */
function LeafletMapOffres({offres,selected,onSelect,city,height=300,userLocation,visible}){
  const mapRef=useRef(null);
  const mapObj=useRef(null);
  const markersRef=useRef({});
  const cityData=CITIES.find(c=>c.id===city)||CITIES[0];

  useEffect(()=>{
    if(!mapObj.current){
      mapObj.current=L.map(mapRef.current,{zoomControl:true,attributionControl:true}).setView([cityData.lat,cityData.lng],cityData.zoom);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:19}).addTo(mapObj.current);
    }
    // Force le recalcul de la taille quand la carte sort du display:none
    setTimeout(()=>{ mapObj.current&&mapObj.current.invalidateSize(); },100);
  },[]);

  // Invalidate quand la carte devient visible
  useEffect(()=>{
    if(!mapObj.current||!visible)return;
    setTimeout(()=>{ mapObj.current&&mapObj.current.invalidateSize(); },150);
  },[visible]);

  useEffect(()=>{
    if(!mapObj.current)return;
    Object.values(markersRef.current).forEach(m=>m.remove());
    markersRef.current={};

    offres.forEach(o=>{
      if(!o.lat||!o.lng)return;
      const type=getTypeMetier(o.type_offre);
      const isSelected=selected?.id===o.id;
      const icon=L.divIcon({
        className:"",
        html:`<div style="width:${isSelected?44:36}px;height:${isSelected?44:36}px;border-radius:50%;background:${isSelected?"#0066FF":type.color};display:flex;align-items:center;justify-content:center;font-size:${isSelected?20:16}px;border:${isSelected?"3px solid white":"2px solid white"};box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:all 0.2s;">${type.emoji}</div>`,
        iconSize:[isSelected?44:36,isSelected?44:36],
        iconAnchor:[isSelected?22:18,isSelected?22:18],
      });
      const marker=L.marker([o.lat,o.lng],{icon}).addTo(mapObj.current);
      marker.on("click",()=>onSelect(o));
      const popup=L.popup({className:"siok-popup",closeButton:false,offset:[0,-20]})
        .setContent(`<div><strong>${o.titre}</strong><br/>${o.prestataire_nom||""}<br/><span style="color:#22c55e;font-weight:700;">-${o.promo_pct}% · ${o.prix?o.prix+"€":"?"}</span></div>`);
      marker.bindPopup(popup);
      markersRef.current[o.id]=marker;
    });

    if(userLocation){
      L.circleMarker([userLocation.lat,userLocation.lng],{radius:8,fillColor:"#0066FF",color:"white",weight:2,fillOpacity:1}).addTo(mapObj.current);
    }
  },[offres,selected]);

  return <div ref={mapRef} style={{height,width:"100%",borderRadius:16,overflow:"hidden"}}/>;
}

/* ══ COMPTE ÉTUDIANT ═════════════════════════════════ */
function EtudiantDashboard({onBack,onHome}){
  const [authStep,setAuthStep]=useState("phone");
  const [phone,setPhone]=useState("");
  const [indicatif,setIndicatif]=useState("+33");
  const [otp,setOtp]=useState(["","","","","",""]);
  const [etudiant,setEtudiant]=useState(null);
  const [offres,setOffres]=useState([]);
  const [favoris,setFavoris]=useState([]);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [tab,setTab]=useState("favoris");
  const otpRefs=useRef([]);

  const sendOTP=async()=>{
    setError("");setLoading(true);
    try{
      const tel=indicatif+phone.replace(/\s/g,"").replace(/^0/,"");
      const {data:e}=await db().from("etudiants").select("*").eq("telephone",tel).maybeSingle();
      setEtudiant(e);
      // Simulation SMS en mode test
      if(TEST_MODE()) console.log("🧪 Code OTP: 123456");
      setAuthStep("otp");
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const verifyOTP=async()=>{
    const code=otp.join("");
    if(!TEST_MODE()&&code!=="123456"){setError("Code incorrect");return;}
    setLoading(true);
    if(!etudiant){
      // Nouveau compte
      setAuthStep("register");
      setLoading(false);
      return;
    }
    await loadDashboard(etudiant.id);
    setAuthStep("dashboard");
    setLoading(false);
  };

  const register=async(form,photoFile)=>{
    setLoading(true);setError("");
    try{
      const tel=indicatif+phone.replace(/\s/g,"").replace(/^0/,"");
      // 1. Créer le compte étudiant d'abord
      const {data:e,error:err}=await db().from("etudiants").insert({
        prenom:form.prenom,telephone:tel,email:form.email||null,
        numero_ine:form.ine||null,etablissement:form.etablissement||null,
        photo_carte_url:null, // sera mis à jour après l'upload
        statut_validation:"en_attente",
      }).select().single();
      if(err)throw err;

      // 2. Uploader la photo APRÈS que le compte existe (évite les erreurs RLS)
      let photoUrl=null;
      if(photoFile){
        try{
          const path=`${e.id}/${Date.now()}_${photoFile.name.replace(/[^a-z0-9.]/gi,"_")}`;
          const {error:upErr}=await db().storage.from("student-cards").upload(path,photoFile,{contentType:photoFile.type,upsert:false});
          if(!upErr){
            photoUrl=`${window.SUPABASE_URL}/storage/v1/object/public/student-cards/${path}`;
            await db().from("etudiants").update({photo_carte_url:photoUrl}).eq("id",e.id);
          }else{
            console.warn("Upload photo optionnel échoué:",upErr.message);
          }
        }catch(photoErr){
          console.warn("Upload photo ignoré:",photoErr.message);
          // Non bloquant — le compte est créé sans photo
        }
      }

      setEtudiant({...e,photo_carte_url:photoUrl});
      setAuthStep("dashboard");
      await loadDashboard(e.id);
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const loadDashboard=async(id)=>{
    setLoading(true);
    try{
      const {data:favData}=await db().from("favoris")
        .select("*, offres(*, prestataires(nom,adresse,lat,lng,type_metier))")
        .eq("etudiant_id",id);
      if(favData){
        setFavoris(favData.map(f=>({
          ...f.offres,
          prestataire_nom:f.offres?.prestataires?.nom,
          adresse:f.offres?.prestataires?.adresse,
          fav_id:f.id,
        })));
      }
    }catch(e){console.error(e);}
    setLoading(false);
  };

  if(authStep==="phone") return(
    <StudentPageShell onBack={onBack} backLabel="Accueil">
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:16}}>🎓</div>
        <div style={{color:CS.text,fontSize:26,fontWeight:900,marginBottom:6,letterSpacing:-0.5}}>Mon compte</div>
        <div style={{color:CS.muted,fontSize:14,marginBottom:28,lineHeight:1.6}}>Connectez-vous ou créez votre compte étudiant</div>
        <TelInput label="Téléphone mobile" value={phone} onChange={setPhone} indicatif={indicatif} onIndicatifChange={setIndicatif} required={true}/>
        {TEST_MODE()&&<div style={{background:"#EEF3FF",borderRadius:10,padding:"8px 14px",marginBottom:14,color:"#0066FF",fontSize:12}}>🧪 Code test : <strong>123456</strong></div>}
        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <StudentBtn onClick={sendOTP} disabled={phone.replace(/\s/g,"").length<9} loading={loading}>
          Recevoir mon code →
        </StudentBtn>
      </div>
    </StudentPageShell>
  );

  if(authStep==="otp") return(
    <StudentPageShell onBack={()=>{setAuthStep("phone");setError("");setOtp(["","","","","",""]);}} backLabel="Modifier">
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:12}}>💬</div>
        <div style={{color:CS.text,fontSize:26,fontWeight:900,marginBottom:6,letterSpacing:-0.5}}>Code envoyé !</div>
        {etudiant?.prenom&&<div style={{color:"#22C55E",fontSize:14,fontWeight:700,marginBottom:24}}>Bonjour {etudiant.prenom} 👋</div>}
        <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:28}}>
          {otp.map((d,i)=>(
            <input key={i} ref={el=>otpRefs.current[i]=el} value={d}
              onChange={e=>{const v=e.target.value.replace(/\D/g,"").slice(-1);const nc=[...otp];nc[i]=v;setOtp(nc);if(v&&i<5)otpRefs.current[i+1]?.focus();}}
              onKeyDown={e=>{if(e.key==="Backspace"&&!d&&i>0){otpRefs.current[i-1]?.focus();const nc=[...otp];nc[i-1]="";setOtp(nc);}}}
              maxLength={1} type="number"
              style={{width:48,height:58,borderRadius:14,textAlign:"center",fontSize:24,fontWeight:700,background:"#FFFFFF",border:`2px solid ${d?CS.accent:"#E8E8E8"}`,color:CS.text,outline:"none",fontFamily:"monospace",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}/>
          ))}
        </div>
        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <StudentBtn onClick={verifyOTP} disabled={otp.join("").length<6} loading={loading}>Accéder à mon compte →</StudentBtn>
        <div style={{marginTop:16,color:CS.muted,fontSize:13}}>Pas reçu ? <span style={{color:CS.accent,cursor:"pointer",fontWeight:600}} onClick={sendOTP}>Renvoyer</span></div>
      </div>
    </StudentPageShell>
  );

  if(authStep==="register") return <EtudiantRegister indicatif={indicatif} phone={phone} onRegister={register} onBack={()=>setAuthStep("otp")} loading={loading} error={error}/>;

  // Dashboard
  return(
    <StudentPageShell onBack={onBack} backLabel="Accueil" topSlot={
      <div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,background:"#F0FFF4",borderRadius:10,padding:"8px 12px"}}>
          <span style={{fontSize:16}}>🎓</span>
          <span style={{color:"#22C55E",fontSize:13,fontWeight:700}}>{etudiant?.prenom}</span>
          <FiabiliteBadge statut={etudiant?.statut_validation||"en_attente"} small={true}/>
        </div>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          {[{v:"favoris",l:"❤️ Favoris"},{v:"profil",l:"👤 Profil"}].map(t=>(
            <button key={t.v} onClick={()=>setTab(t.v)}
              style={{flex:1,padding:"9px 0",borderRadius:10,border:`1.5px solid ${tab===t.v?CS.accent:"#E8E8E8"}`,background:tab===t.v?CS.accentSoft:"transparent",color:tab===t.v?CS.accent:CS.muted,fontSize:13,fontWeight:tab===t.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>
    }>
      <div style={{padding:"16px 16px 0"}}>
        {etudiant?.statut_validation==="en_attente"&&(
          <div style={{background:"#FFF9E6",border:"1px solid #F5E27A",borderRadius:12,padding:"12px 14px",marginBottom:16,fontSize:13,color:"#B8860B",lineHeight:1.6}}>
            ⏳ Votre compte est en attente de validation par l'équipe IOK'S. Vous pouvez déjà consulter les offres !
          </div>
        )}

        {tab==="favoris"&&(
          <div>
            {loading&&<div style={{textAlign:"center",padding:32,color:CS.muted}}>Chargement…</div>}
            {!loading&&favoris.length===0&&(
              <div style={{textAlign:"center",padding:"40px 20px",color:CS.muted}}>
                <div style={{fontSize:40,marginBottom:12}}>❤️</div>
                <div style={{color:CS.text,fontWeight:700,marginBottom:6}}>Aucun favori</div>
                <div style={{fontSize:13}}>Sauvegardez des offres depuis la recherche</div>
              </div>
            )}
            {favoris.map(o=>(
              <div key={o.id} style={{background:"#FFFFFF",borderRadius:16,padding:"14px 16px",marginBottom:12,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:48,height:48,borderRadius:12,background:bannerColorSiok(o.titre),display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>
                    {getTypeMetier(o.type_offre).emoji}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{color:CS.text,fontWeight:700,fontSize:14}}>{o.titre}</div>
                    <div style={{color:CS.muted,fontSize:12}}>{o.prestataire_nom}</div>
                  </div>
                  <div style={{background:CS.accentSoft,color:CS.accent,fontWeight:900,fontSize:14,padding:"4px 10px",borderRadius:20}}>-{o.promo_pct}%</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {tab==="profil"&&(
          <div>
            <div style={{background:"#FFFFFF",borderRadius:16,padding:"16px",marginBottom:12,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}}>
              {[
                {l:"Prénom",v:etudiant?.prenom},
                {l:"Téléphone",v:etudiant?.telephone},
                {l:"Email",v:etudiant?.email||"—"},
                {l:"Établissement",v:etudiant?.etablissement||"—"},
                {l:"N° INE",v:etudiant?.numero_ine||"—"},
              ].map(({l,v})=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #F0F0F0"}}>
                  <span style={{color:CS.muted,fontSize:13}}>{l}</span>
                  <span style={{color:CS.text,fontSize:13,fontWeight:600}}>{v}</span>
                </div>
              ))}
            </div>
            <button onClick={()=>{setEtudiant(null);setAuthStep("phone");setOtp(["","","","","",""]);}}
              style={{width:"100%",padding:"12px",borderRadius:12,border:"1.5px solid #E8E8E8",background:"transparent",color:CS.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
              Se déconnecter
            </button>
          </div>
        )}
      </div>
    </StudentPageShell>
  );
}

/* ══ INSCRIPTION ÉTUDIANT ════════════════════════════ */
function EtudiantRegister({indicatif,phone,onRegister,onBack,loading,error}){
  const [form,setForm]=useState({prenom:"",email:"",ine:"",etablissement:"",photoUrl:""});
  const [uploading,setUploading]=useState(false);
  const [uploadError,setUploadError]=useState("");

  // Stocke le fichier en mémoire — l'upload réel se fait dans register() après création du compte
  const [photoFile,setPhotoFile]=useState(null);

  const handlePhoto=(file)=>{
    setUploadError("");
    if(!file.type.startsWith("image/")){setUploadError("Fichier image requis (JPG, PNG)");return;}
    if(file.size>5*1024*1024){setUploadError("Image trop lourde (max 5Mo)");return;}
    setPhotoFile(file);
    // Aperçu local sans upload
    const reader=new FileReader();
    reader.onload=e=>setForm(f=>({...f,photoPreview:e.target.result}));
    reader.readAsDataURL(file);
  };

  return(
    <StudentPageShell onBack={onBack} backLabel="Retour" stickyHeader={false}>
      <div style={{padding:"24px 20px"}}>
        <div style={{color:CS.text,fontSize:22,fontWeight:900,marginBottom:4,letterSpacing:-0.5}}>Créer mon compte</div>
        <div style={{color:CS.muted,fontSize:14,marginBottom:24}}>Réservé aux lycéens et étudiants</div>

        <StudentFInput label="Prénom" value={form.prenom} onChange={v=>setForm(f=>({...f,prenom:v}))} placeholder="Marie" required={true}/>
        <StudentFInput label="Email" type="email" value={form.email} onChange={v=>setForm(f=>({...f,email:v}))} placeholder="marie@email.com (optionnel)"/>

        {/* Vérification statut étudiant */}
        <div style={{background:"#F0F6FF",borderRadius:14,padding:14,marginBottom:16}}>
          <div style={{color:CS.text,fontSize:13,fontWeight:700,marginBottom:12}}>🎓 Vérification de votre statut</div>
          <StudentFInput label="Numéro INE (lycéen/étudiant)" value={form.ine} onChange={v=>setForm(f=>({...f,ine:v}))} placeholder="11 caractères alphanumériques" hint="Identifiant National Étudiant sur votre carte ou certificat de scolarité"/>
          <StudentFInput label="Établissement" value={form.etablissement} onChange={v=>setForm(f=>({...f,etablissement:v}))} placeholder="Lycée Victor Hugo, Université de Lyon…"/>

          {/* Upload carte */}
          <div style={{marginBottom:8}}>
            <div style={{color:CS.text,fontSize:13,fontWeight:700,marginBottom:8}}>📷 Photo de votre carte étudiante</div>
            <label style={{display:"block",border:"2px dashed #C0D4FF",borderRadius:12,padding:"16px",textAlign:"center",cursor:"pointer",background:"rgba(0,102,255,0.03)"}}>
              <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&handlePhoto(e.target.files[0])}/>
              {form.photoPreview
                ?<div>
                  <img src={form.photoPreview} alt="carte" style={{width:80,height:52,objectFit:"cover",borderRadius:8,margin:"0 auto 8px"}}/>
                  <div style={{color:"#22C55E",fontWeight:700,fontSize:13}}>✓ Photo prête à envoyer</div>
                </div>
                :<div>
                  <div style={{fontSize:28,marginBottom:6}}>📷</div>
                  <div style={{color:CS.accent,fontWeight:700,fontSize:13}}>Charger une photo</div>
                  <div style={{color:CS.muted,fontSize:11,marginTop:4}}>JPG, PNG · max 5Mo</div>
                </div>
              }
            </label>
            {uploadError&&<div style={{color:"#ef4444",fontSize:12,marginTop:4}}>⚠️ {uploadError}</div>}
          </div>
          <div style={{color:CS.muted,fontSize:11,lineHeight:1.5}}>
            📋 Votre compte sera validé manuellement par l'équipe IOK'S sous 24h.
          </div>
        </div>

        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}

        <StudentBtn onClick={()=>onRegister(form)} disabled={!form.prenom||loading} loading={loading}>
          Créer mon compte →
        </StudentBtn>
      </div>
    </StudentPageShell>
  );
}

/* ══ AUTH PRESTATAIRE ════════════════════════════════ */
function PrestataireLogin({onSuccess,onBack}){
  const [form,setForm]=useState({email:"",password:""});
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const login=async()=>{
    setError("");setLoading(true);
    try{
      const {data,error:err}=await db().auth.signInWithPassword({email:form.email,password:form.password});
      if(err)throw err;
      onSuccess(data.user);
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  return(
    <PrestPageShell onBack={onBack} backLabel="Accueil">
      <div style={{padding:"32px 20px"}}>
        <div style={{color:C.text,fontSize:24,fontWeight:800,marginBottom:4}}>Espace prestataire</div>
        <div style={{color:C.muted,fontSize:13,marginBottom:28}}>Gérez vos offres étudiantes</div>
        <FInput label="Email" type="email" value={form.email} onChange={v=>setForm(f=>({...f,email:v}))} placeholder="votre@email.com" required={true}/>
        <FInput label="Mot de passe" type="password" value={form.password} onChange={v=>setForm(f=>({...f,password:v}))} placeholder="••••••••" required={true}/>
        {error&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <Btn onClick={login} disabled={!form.email||!form.password} loading={loading}>Se connecter</Btn>
      </div>
    </PrestPageShell>
  );
}

/* ══ DASHBOARD PRESTATAIRE ═══════════════════════════ */
function PrestataireDashboard({user,onLogout,onHome}){
  const [prestataires,setPrestataires]=useState([]);
  const [active,setActive]=useState(null);
  const [offres,setOffres]=useState([]);
  const [view,setView]=useState("dashboard"); // dashboard | edit-offre | new-offre
  const [editingOffre,setEditingOffre]=useState(null);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [dashTab,setDashTab]=useState("offres"); // offres | medias | profil

  useEffect(()=>{loadPrestataires();},[]);

  const loadPrestataires=async()=>{
    setLoading(true);
    try{
      const {data}=await db().from("prestataires").select("*").eq("auth_id",user.id);
      if(data&&data.length>0){
        setPrestataires(data);
        setActive(data[0]);
        await loadOffres(data[0].id);
      }
    }catch(e){console.error(e);}
    setLoading(false);
  };

  const loadOffres=async(prestId)=>{
    const {data}=await db().from("offres").select("*").eq("prestataire_id",prestId).order("created_at",{ascending:false});
    setOffres(data||[]);
  };

  const toggleOffre=async(offre)=>{
    const next=!offre.active;
    await db().from("offres").update({active:next}).eq("id",offre.id);
    setOffres(os=>os.map(o=>o.id===offre.id?{...o,active:next}:o));
    setToast({msg:next?"Offre activée ✅":"Offre désactivée",type:next?"success":"info"});
    setTimeout(()=>setToast(null),2500);
  };

  if(loading) return <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.muted}}>Chargement…</div>;

  if(!active) return(
    <PrestPageShell onBack={onLogout} backLabel="Déconnexion">
      <div style={{padding:24,textAlign:"center",color:C.muted}}>
        <div style={{fontSize:48,marginBottom:16}}>🏪</div>
        <div style={{color:C.text,fontSize:18,fontWeight:700,marginBottom:8}}>Aucun profil prestataire</div>
        <div style={{fontSize:13,marginBottom:24}}>Votre compte n'est pas encore associé à un prestataire. Contactez l'administrateur IOK'S.</div>
        <Btn variant="outline" onClick={onLogout}>Se déconnecter</Btn>
      </div>
    </PrestPageShell>
  );

  if(view==="edit-offre"||view==="new-offre") return(
    <OffreEditor
      offre={editingOffre}
      prestataireId={active.id}
      onBack={()=>{setView("dashboard");setEditingOffre(null);}}
      onSaved={async()=>{await loadOffres(active.id);setView("dashboard");setEditingOffre(null);setToast({msg:"Offre sauvegardée ✅",type:"success"});setTimeout(()=>setToast(null),2500);}}
    />
  );

  const type=getTypeMetier(active.type_metier);

  return(
    <PrestPageShell onBack={dashTab==="offres"?onLogout:()=>setDashTab("offres")} backLabel={dashTab==="offres"?"Déconnexion":"← Offres"} onHome={onHome} topSlot={
      <div>
        {toast&&<div style={{background:toast.type==="success"?"rgba(34,197,94,0.15)":"rgba(0,102,255,0.1)",border:`1px solid ${toast.type==="success"?"rgba(34,197,94,0.4)":C.accent}`,borderRadius:10,padding:"8px 14px",marginBottom:8,color:toast.type==="success"?"#22c55e":C.accent,fontSize:13,fontWeight:600}}>{toast.msg}</div>}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <div style={{fontSize:28}}>{type.emoji}</div>
          <div>
            <div style={{color:C.text,fontWeight:800,fontSize:16}}>{active.nom}</div>
            <div style={{color:C.muted,fontSize:12}}>{type.label} · {active.ville}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          {[{v:"offres",l:"🎯 Mes offres"},{v:"profil",l:"👤 Profil"}].map(t=>(
            <button key={t.v} onClick={()=>setDashTab(t.v)}
              style={{flex:1,padding:"9px 0",borderRadius:10,border:`1px solid ${dashTab===t.v?C.accent:C.border}`,background:dashTab===t.v?C.accentSoft:"transparent",color:dashTab===t.v?C.accent:C.muted,fontSize:12,fontWeight:dashTab===t.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>
    }>
      <div style={{padding:"16px 20px"}}>

        {dashTab==="offres"&&(
          <div>
            {/* Bouton nouvelle offre */}
            <button onClick={()=>{setEditingOffre(null);setView("new-offre");}}
              style={{width:"100%",padding:"14px",borderRadius:14,border:"none",background:`linear-gradient(135deg,#0066FF,#3399FF)`,color:"white",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:16,boxShadow:"0 4px 16px rgba(0,102,255,0.35)"}}>
              + Créer une nouvelle offre
            </button>

            {offres.length===0&&(
              <div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}>
                <div style={{fontSize:48,marginBottom:12}}>🎯</div>
                <div style={{color:C.text,fontWeight:700,marginBottom:6}}>Aucune offre</div>
                <div style={{fontSize:13}}>Créez votre première offre promotionnelle</div>
              </div>
            )}

            {offres.map(o=>{
              const ot=getTypeMetier(o.type_offre);
              return(
                <div key={o.id} style={{background:C.card,border:`1px solid ${o.active?"rgba(34,197,94,0.3)":C.border}`,borderRadius:14,padding:"14px 16px",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                    <span style={{fontSize:24}}>{ot.emoji}</span>
                    <div style={{flex:1}}>
                      <div style={{color:C.text,fontWeight:700,fontSize:15}}>{o.titre}</div>
                      <div style={{color:C.muted,fontSize:12}}>{o.prix?`${o.prix}€ · `:""}{o.permanente?"Permanente":"Temporaire"}</div>
                    </div>
                    <div style={{background:o.active?"rgba(34,197,94,0.15)":"rgba(107,114,128,0.15)",color:o.active?"#22c55e":"#6b7280",fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
                      {o.active?"Active":"Inactive"}
                    </div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                    <div style={{background:C.accentSoft,color:C.accent,fontWeight:900,fontSize:16,padding:"4px 14px",borderRadius:20}}>-{o.promo_pct}%</div>
                    {!o.permanente&&o.date_fin&&<div style={{color:C.muted,fontSize:11}}>⏰ jusqu'au {fmtDate(o.date_fin)}</div>}
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>toggleOffre(o)}
                      style={{flex:1,padding:"8px 0",borderRadius:10,border:`1px solid ${o.active?"rgba(239,68,68,0.3)":"rgba(34,197,94,0.3)"}`,background:o.active?"rgba(239,68,68,0.06)":"rgba(34,197,94,0.06)",color:o.active?"#ef4444":"#22c55e",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                      {o.active?"Désactiver":"Activer"}
                    </button>
                    <button onClick={()=>{setEditingOffre(o);setView("edit-offre");}}
                      style={{flex:1,padding:"8px 0",borderRadius:10,border:`1px solid ${C.border}`,background:"transparent",color:C.sub,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                      ✏️ Modifier
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {dashTab==="profil"&&(
          <div>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:16,marginBottom:12}}>
              {[
                {l:"Nom",v:active.nom},
                {l:"Type",v:`${type.emoji} ${type.label}`},
                {l:"Adresse",v:active.adresse||"—"},
                {l:"Ville",v:active.ville||"—"},
                {l:"Téléphone",v:active.telephone||"—"},
              ].map(({l,v})=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                  <span style={{color:C.muted,fontSize:13}}>{l}</span>
                  <span style={{color:C.text,fontSize:13,fontWeight:600}}>{v}</span>
                </div>
              ))}
            </div>
            <Btn variant="outline" onClick={onLogout}>Se déconnecter</Btn>
          </div>
        )}
      </div>
    </PrestPageShell>
  );
}

/* ══ ÉDITEUR D'OFFRE ═════════════════════════════════ */
function OffreEditor({offre,prestataireId,onBack,onSaved}){
  const isNew=!offre;
  const [form,setForm]=useState({
    titre:offre?.titre||"",
    description:offre?.description||"",
    type_offre:offre?.type_offre||"restaurant",
    prix:offre?.prix||"",
    image_emoji:offre?.image_emoji||"🎯",
    permanente:offre?.permanente!==false,
    date_debut:offre?.date_debut?offre.date_debut.slice(0,10):"",
    date_fin:offre?.date_fin?offre.date_fin.slice(0,10):"",
    promo_pct:offre?.promo_pct||10,
    menu_url:offre?.menu_url||"",
  });
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");

  const save=async()=>{
    if(!form.titre)return setError("Le titre est obligatoire");
    setSaving(true);setError("");
    try{
      const payload={
        ...form,
        prix:form.prix?parseFloat(form.prix):null,
        date_debut:form.permanente||!form.date_debut?null:new Date(form.date_debut).toISOString(),
        date_fin:form.permanente||!form.date_fin?null:new Date(form.date_fin).toISOString(),
        prestataire_id:prestataireId,
        active:true,
      };
      if(isNew){
        const {error:err}=await db().from("offres").insert(payload);
        if(err)throw err;
      }else{
        const {error:err}=await db().from("offres").update(payload).eq("id",offre.id);
        if(err)throw err;
      }
      onSaved();
    }catch(e){setError(e.message);}
    setSaving(false);
  };

  return(
    <PrestPageShell onBack={onBack} backLabel="← Mes offres" stickyHeader={false}>
      <div style={{padding:"20px"}}>
        <div style={{color:C.text,fontSize:20,fontWeight:800,marginBottom:16}}>{isNew?"Nouvelle offre":"Modifier l'offre"}</div>

        <FInput label="Titre de l'offre" value={form.titre} onChange={v=>setForm(f=>({...f,titre:v}))} placeholder="Ex: Coupe étudiant, Repas du jour…" required={true}/>
        <FInput label="Description (optionnel)" value={form.description} onChange={v=>setForm(f=>({...f,description:v}))} placeholder="Décrivez votre offre…"/>
        <FInput label="Prix promo (€)" type="number" value={form.prix} onChange={v=>setForm(f=>({...f,prix:v}))} placeholder="Ex: 8.50"/>
        <FInput label="URL détail offre (optionnel)" value={form.menu_url} onChange={v=>setForm(f=>({...f,menu_url:v}))} placeholder="https://…"/>

        {/* Type d'offre */}
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Type d'offre *</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {TYPES_METIER.map(t=>(
              <button key={t.id} onClick={()=>setForm(f=>({...f,type_offre:t.id}))}
                style={{padding:"8px 14px",borderRadius:10,border:`1px solid ${form.type_offre===t.id?C.accent:C.border}`,background:form.type_offre===t.id?C.accentSoft:"transparent",color:form.type_offre===t.id?C.accent:C.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:form.type_offre===t.id?700:400}}>
                {t.emoji} {t.label}
              </button>
            ))}
          </div>
        </div>

        {/* % remise */}
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>% de remise * <span style={{color:C.accent}}>({form.promo_pct}%)</span></div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {PROMO_PCTS.map(p=>(
              <button key={p} onClick={()=>setForm(f=>({...f,promo_pct:p}))}
                style={{padding:"8px 14px",borderRadius:10,border:`1px solid ${form.promo_pct===p?C.accent:C.border}`,background:form.promo_pct===p?C.accentSoft:"transparent",color:form.promo_pct===p?C.accent:C.muted,fontSize:13,fontWeight:form.promo_pct===p?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                -{p}%
              </button>
            ))}
          </div>
        </div>

        {/* Permanente / temporaire */}
        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Durée</div>
          <div style={{display:"flex",gap:8}}>
            {[{v:true,l:"✓ Permanente"},{v:false,l:"⏰ Temporaire"}].map(opt=>(
              <button key={String(opt.v)} onClick={()=>setForm(f=>({...f,permanente:opt.v}))}
                style={{flex:1,padding:"10px 0",borderRadius:10,border:`1px solid ${form.permanente===opt.v?C.accent:C.border}`,background:form.permanente===opt.v?C.accentSoft:"transparent",color:form.permanente===opt.v?C.accent:C.muted,fontSize:13,fontWeight:form.permanente===opt.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                {opt.l}
              </button>
            ))}
          </div>
          {!form.permanente&&(
            <div style={{display:"flex",gap:10,marginTop:10}}>
              <div style={{flex:1}}>
                <FInput label="Date début" type="date" value={form.date_debut} onChange={v=>setForm(f=>({...f,date_debut:v}))}/>
              </div>
              <div style={{flex:1}}>
                <FInput label="Date fin" type="date" value={form.date_fin} onChange={v=>setForm(f=>({...f,date_fin:v}))}/>
              </div>
            </div>
          )}
        </div>

        {error&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}

        <Btn onClick={save} loading={saving}>
          {isNew?"Créer l'offre":"Sauvegarder les modifications"}
        </Btn>
      </div>
    </PrestPageShell>
  );
}

/* ══ ROOT ════════════════════════════════════════════ */
function App(){
  const [screen,setScreen]=useState("splash");
  const [user,setUser]=useState(null);
  const [etudiant,setEtudiant]=useState(null);

  const onStart=(s)=>{
    if(s==="etudiant")setScreen("etudiant-search");
    else if(s==="mon-compte")setScreen("etudiant-compte");
    else if(s==="prestataire")setScreen("prestataire-login");
  };

  if(screen==="splash") return <Splash onStart={onStart}/>;

  if(screen==="etudiant-search") return(
    <EtudiantSearch
      onBack={()=>setScreen("splash")}
      onHome={()=>setScreen("splash")}
      onMonCompte={()=>setScreen("etudiant-compte")}
      etudiant={etudiant}
    />
  );

  if(screen==="etudiant-compte") return(
    <EtudiantDashboard
      onBack={()=>setScreen("splash")}
      onHome={()=>setScreen("splash")}
    />
  );

  if(screen==="prestataire-login") return(
    <PrestataireLogin
      onSuccess={(u)=>{setUser(u);setScreen("prestataire-dashboard");}}
      onBack={()=>setScreen("splash")}
    />
  );

  if(screen==="prestataire-dashboard") return(
    <PrestataireDashboard
      user={user}
      onLogout={()=>{setUser(null);setScreen("splash");}}
      onHome={()=>setScreen("splash")}
    />
  );

  return <Splash onStart={onStart}/>;
}

function mountApp(){
  const loader=document.getElementById("splash-loader");
  const root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
  if(loader){
    loader.style.transition="opacity 0.5s";
    loader.style.opacity="0";
    setTimeout(()=>loader.style.display="none",600);
  }
}

loadParams().then(()=>mountApp());
  </script>
